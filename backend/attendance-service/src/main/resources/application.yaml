server:
  port: 8083

spring:
  application:
    name: attendance-service

  mongodb:
    uri: ${ATTENDANCE_MONGODB_URI}

  data:
    mongodb:
      auto-index-creation: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: attendance-auth-service
      audience: attendance-api

  internal:
    api-key: ${INTERNAL_API_KEY}

  attendance:
    attempt-ttl: 60s
    maximum-location-accuracy-meters: 500
    finalizer-delay: 60s

logging:
  level:
    org.springframework.security: TRACE