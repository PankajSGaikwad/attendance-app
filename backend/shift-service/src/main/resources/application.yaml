server:
  port: 8085

spring:
  application:
    name: shift-service

  mongodb:
    uri: ${SHIFT_MONGODB_URI}

  data:
    mongodb:
      auto-index-creation: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: attendance-auth-service
      audience: attendance-api

  internal:
    api-key: ${INTERNAL_API_KEY}