server:
  port: 8084

spring:
  application:
    name: media-service

  mongodb:
    uri: ${MEDIA_MONGODB_URI}

  data:
    mongodb:
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:

  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: attendance-auth-service
      audience: attendance-api

  internal:
    api-key: ${INTERNAL_API_KEY}

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}

  media:
    max-photo-size: 8MB