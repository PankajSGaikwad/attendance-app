server:
  port: 8081

spring:
  application:
    name: auth-service

  mongodb:
    uri: ${AUTH_MONGODB_URI}

  data:
    mongodb:
      auto-index-creation: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: attendance-auth-service
      audience: attendance-api
      access-token-ttl: 15m

    refresh:
      token-ttl: 7d

    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}